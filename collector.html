<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Collector Portal</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f9fafb;
  color: #2c3e50;
}
header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
.container {
  max-width: 600px;
  margin: 30px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.submit-btn {
  background: #27ae60;
  color: white;
  padding: 8px;
  border: none;
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
}
img {
  margin-top: 8px;
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 10px;
}
</style>
</head>
<body>

<header>🚛 Collector Portal</header>

<div class="container">
<div id="collectorInfo">Loading...</div>
</div>

<script>

let pendingRequests = JSON.parse(localStorage.getItem("pendingRequests")) || [];
let records = JSON.parse(localStorage.getItem("wasteRecords")) || [];

renderPendingRequests();

function renderPendingRequests() {

  const container = document.getElementById("collectorInfo");

  pendingRequests = JSON.parse(localStorage.getItem("pendingRequests")) || [];

  if (pendingRequests.length === 0) {
    container.innerHTML = "✅ No pending requests!";
    return;
  }

  container.innerHTML = "";

  pendingRequests.forEach((req, index) => {

    const div = document.createElement("div");
    div.style.border = "1px solid #ddd";
    div.style.margin = "10px 0";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";

    div.innerHTML = `
      🔔 <b>Request ${index+1}</b><br>
      📍 Location: ${req.location}<br>
      🏢 Source: ${req.type}<br>
      👷 Assigned To: <b>${req.team}</b><br>
      🚛 Vehicle: <b>${req.vehicle}</b><br>
      ⏰ Time: ${req.time}<br>
      📝 Note: ${req.note || "None"}<br>

      ${req.image ? `
        <br>📸 Image:<br>
        <img src="${req.image}">
      ` : ""}

      <br><br>
      <button class="submit-btn" onclick="markPicked(${index})">
        Mark as Picked
      </button>
    `;

    container.appendChild(div);
  });
}

function markPicked(index) {

  pendingRequests = JSON.parse(localStorage.getItem("pendingRequests")) || [];
  let records = JSON.parse(localStorage.getItem("wasteRecords")) || [];
  let current = pendingRequests.splice(index, 1)[0];
  current.status = "Picked";

  let recordIndex = records.findIndex(r =>
    r.date === current.date &&
    r.time === current.time &&
    r.location === current.location
  );

  if (recordIndex > -1) {
    records[recordIndex].status = "Picked";
  }

  let teamHistory = JSON.parse(localStorage.getItem("teamHistory")) || [];
  let memberName = current.team.split(" (")[0];

  let memberIndex = teamHistory.findIndex(m => m.name === memberName);

  if (memberIndex > -1) {
    teamHistory[memberIndex].available = true;
  }

  localStorage.setItem("teamHistory", JSON.stringify(teamHistory));
  localStorage.setItem("pendingRequests", JSON.stringify(pendingRequests));
  localStorage.setItem("wasteRecords", JSON.stringify(records));

  renderPendingRequests();
}

</script>

</body>
</html>

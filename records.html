<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collection Records</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      color: #2c3e50;
      padding: 20px;
    }
    h2 { text-align: center; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      table-layout: fixed; /* ✅ fixes column shifting */
    }
    table, th, td { border: 1px solid #ddd; }
    th, td {
      padding: 8px;
      text-align: center;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    th { background-color: #2c3e50; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }

    .btn {
      margin: 20px auto;
      display: block;
      padding: 10px 20px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #219150; }
    .back-btn {
      background: #3498db;
      margin-bottom: 10px;
    }
    .back-btn:hover { background: #217dbb; }
  </style>
</head>
<body>

<h2>📑 Collection Records</h2>
<a href="teamhistory.html"><button class="btn back-btn">⬅ Go To Teamhistory</button></a>

<table id="recordsTable">
  <tr>
    <th>Date</th>
    <th>Time</th>
    <th>Location</th>
    <th>Source</th>
    <th>Team</th>
    <th>Status</th>
    <th>Note</th>
  </tr>
</table>

<button class="btn" onclick="clearRecords()">Clear Records</button>

<script>
  let records = JSON.parse(localStorage.getItem("wasteRecords")) || [];
  renderRecords();

  function renderRecords() {
    const table = document.getElementById("recordsTable");
    while (table.rows.length > 1) table.deleteRow(1);

    records.forEach(record => {
      const row = table.insertRow(-1);
      row.insertCell(0).innerText = record.date;
      row.insertCell(1).innerText = record.time;
      row.insertCell(2).innerText = record.location;
      row.insertCell(3).innerText = record.type;
      row.insertCell(4).innerText = record.team;
      row.insertCell(5).innerText = record.status;
      row.insertCell(6).innerText = record.note || "None";
    });
  }

  function clearRecords() {
    if (confirm("Are you sure you want to clear all collected records?")) {
      records = [];
      localStorage.removeItem("wasteRecords");
      renderRecords();
    }
  }
</script>

</body>
</html>

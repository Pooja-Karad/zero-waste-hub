<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team History</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#f4f6f8;
}

header{
background:#2c3e50;
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:750px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.add-btn{
width:100%;
margin-top:18px;
background:#27ae60;
color:white;
}

.add-btn:hover{
background:#219150;
}

.member{
margin-top:15px;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
background:#fafafa;
}

.delete-btn{
margin-top:10px;
background:#e74c3c;
color:white;
width:100%;
}

.status{
font-weight:bold;
color:green;
}

.back{
display:block;
text-align:center;
margin-top:20px;
background:#3498db;
padding:12px;
border-radius:8px;
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<header>👷 Team & Vehicle Management</header>

<div class="container">

<h2>Add Team Member</h2>

<label>Name</label>
<input id="name" type="text">

<label>Contact</label>
<input id="contact" type="text">

<label>Waste Source</label>
<select id="source">
<option value="Hospital">Hospital</option>
<option value="Household">Household</option>
<option value="Commercial Place">Commercial Place</option>
</select>

<label>Vehicle Number</label>
<input id="vehicle" type="text">

<button class="add-btn" onclick="addMember()">Add Member</button>

<h2>Team Members</h2>

<div id="teamList"></div>

<a class="back" href="records.html">Go To Records</a>

</div>

<script>

let teamHistory=JSON.parse(localStorage.getItem("teamHistory"))||[];

function addMember(){

const name=document.getElementById("name").value.trim();
const contact=document.getElementById("contact").value.trim();
const source=document.getElementById("source").value;
const vehicle=document.getElementById("vehicle").value.trim();

if(name==""||contact==""||vehicle==""){
alert("Please fill all fields");
return;
}

let member={
name:name,
contact:contact,
source:source,
vehicle:vehicle,
available:true
};

teamHistory.push(member);

localStorage.setItem("teamHistory",JSON.stringify(teamHistory));

alert("Member Added Successfully");

document.getElementById("name").value="";
document.getElementById("contact").value="";
document.getElementById("vehicle").value="";

renderTeam();
}
function renderTeam(){

const container=document.getElementById("teamList");

container.innerHTML="";

if(teamHistory.length==0){

container.innerHTML="<p>No team members added yet.</p>";

return;

}

teamHistory.forEach((member,index)=>{

let status=member.available?"🟢 Available":"🔴 Busy";

container.innerHTML+=`

<div class="member">

<b>👷 ${member.name}</b><br><br>

📞 <b>Contact:</b> ${member.contact}<br>

🏢 <b>Source:</b> ${member.source}<br>

🚛 <b>Vehicle:</b> ${member.vehicle}<br>

<b>Status:</b>
<span class="status">${status}</span>

<button class="delete-btn" onclick="deleteMember(${index})">
Delete Member
</button>

</div>

`;

});

}

function deleteMember(index){

if(confirm("Delete this member?")){

teamHistory.splice(index,1);

localStorage.setItem("teamHistory",JSON.stringify(teamHistory));

renderTeam();

}

}

renderTeam();

</script>

</body>
</html>

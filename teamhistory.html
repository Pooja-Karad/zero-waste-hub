<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team History - Smart Waste</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      color: #2c3e50;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin: 8px 0 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      margin-top: 5px;
    }

    .add-btn {
      background: #27ae60;
      color: white;
    }

    .add-btn:hover {
      background: #219150;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
      margin-top: 8px;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .member {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 10px;
      border-radius: 8px;
      width: 200px;
      margin-left: auto;
      margin-right: auto;
    }

    .back-link:hover {
      background: #217dbb;
    }
  </style>
</head>
<body>

<header>👷 Team & Vehicle Management</header>

<div class="container">

  <h2>Add Team Member</h2>

  <label>👷 Name</label>
  <input type="text" id="name" placeholder="Enter name">

  <label>📞 Contact</label>
  <input type="text" id="contact" placeholder="Enter contact number">

  <label>🏢 Waste Source</label>
  <select id="source">
    <option value="Hospital">Hospital</option>
    <option value="Household">Household</option>
    <option value="Commercial Place">Commercial Place</option>
  </select>

  <label>🚛 Vehicle Number</label>
  <input type="text" id="vehicle" placeholder="Enter vehicle number">

  <button class="add-btn" onclick="addMember()">Add Member</button>

  <h2>Team List</h2>
  <div id="teamList"></div>

</div>

<a href="records.html" class="back-link">⬅ Go To Records</a>

<script>

let teamHistory = JSON.parse(localStorage.getItem("teamHistory")) || [];

function addMember() {
  const name = document.getElementById("name").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const source = document.getElementById("source").value;
  const vehicle = document.getElementById("vehicle").value.trim();

  if (!name || !contact || !vehicle) {
    alert("Please fill all fields!");
    return;
  }

  const member = {
    name: name,
    contact: contact,
    source: source,
    vehicle: vehicle
  };

  teamHistory.push(member);
  localStorage.setItem("teamHistory", JSON.stringify(teamHistory));

  alert("Team member added successfully!");

  document.getElementById("name").value = "";
  document.getElementById("contact").value = "";
  document.getElementById("vehicle").value = "";

  renderTeam();
}

function renderTeam() {
  const container = document.getElementById("teamList");
  container.innerHTML = "";

  if (teamHistory.length === 0) {
    container.innerHTML = "No team members added yet.";
    return;
  }

  teamHistory.forEach((member, index) => {
    const div = document.createElement("div");
    div.className = "member";

    div.innerHTML = `
      👷 <b>${member.name}</b><br>
      📞 ${member.contact}<br>
      🏢 ${member.source}<br>
      🚛 ${member.vehicle}<br>
      <button class="delete-btn" onclick="deleteMember(${index})">Delete</button>
    `;

    container.appendChild(div);
  });
}

function deleteMember(index) {
  if (confirm("Delete this member?")) {
    teamHistory.splice(index, 1);
    localStorage.setItem("teamHistory", JSON.stringify(teamHistory));
    renderTeam();
  }
}

renderTeam();

</script>

</body>
</html>

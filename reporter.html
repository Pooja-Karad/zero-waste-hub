<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Waste Reporter</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#d9fbe5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.container{
    background:#fff;
    width:420px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
h2{
    text-align:center;
    color:#15803d;
    margin-bottom:20px;
}
label{
    display:block;
    margin-top:12px;
    font-weight:bold;
    color:#166534;
}
input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #22c55e;
    border-radius:10px;
}
button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:25px;
    background:#16a34a;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}
button:hover{
    background:#15803d;
}
.status-box{
    background:#ecfdf5;
    border-left:5px solid #16a34a;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}
.free{color:green;font-weight:bold;}
.busy{color:red;font-weight:bold;}
</style>
</head>
<body>

<div class="container">

<h2>♻️ Smart Waste Management System</h2>

<div id="teamStatus" class="status-box">
Loading team status...
</div>

<label>📍 Address</label>
<input type="text" id="addressInput" placeholder="Enter address">

<label>🏢 Waste Source</label>
<select id="wasteType" onchange="showTeamStatus()">
<option value="Hospital">Hospital</option>
<option value="Household">Household</option>
<option value="Commercial Place">Commercial Place</option>
</select>

<label>📝 Note</label>
<textarea id="noteInput" rows="3" placeholder="Enter waste details"></textarea>

<label>📸 Upload Image</label>
<input type="file" id="imageInput" accept="image/*">

<button onclick="submitRequest()">Submit Request</button>

</div>

<script>

// ---------------- TEAM STATUS ----------------

function showTeamStatus(){

    let teamHistory = JSON.parse(localStorage.getItem("teamHistory")) || [];

    const type = document.getElementById("wasteType").value;

    const box = document.getElementById("teamStatus");

    let members = teamHistory.filter(m => m.source === type);

    if(members.length === 0){

        box.innerHTML = "No team member available for this category.";

        return;
    }

    box.innerHTML = "<b>🚛 Team Status:</b><br><br>";

    members.forEach(m => {

        let status = (m.available !== false);

        box.innerHTML += `
        👷 ${m.name} |
        📞 ${m.contact} |
        🚛 ${m.vehicle} |
        Status:
        <span class="${status ? 'free' : 'busy'}">
        ${status ? 'Free' : 'Busy'}
        </span>
        <br><br>`;

    });

}

// ---------------- ASSIGN COLLECTOR ----------------

function assignCollector(type){

    let teamHistory = JSON.parse(localStorage.getItem("teamHistory")) || [];

    let members = teamHistory.filter(m => m.source === type);

    if(members.length === 0){

        return null;

    }

    // First available member
    let assigned = members.find(m => m.available !== false);

    // If all busy, assign first member
    if(!assigned){

        assigned = members[0];

    }

    assigned.available = false;

    localStorage.setItem("teamHistory", JSON.stringify(teamHistory));

    return assigned;

}

// ---------------- SUBMIT REQUEST ----------------

function submitRequest(){

    const address = document.getElementById("addressInput").value.trim();

    const note = document.getElementById("noteInput").value.trim();

    const type = document.getElementById("wasteType").value;

    const imageFile = document.getElementById("imageInput").files[0];

    if(address === ""){

        alert("Please enter address!");

        return;
    }

    let assigned = assignCollector(type);

    if(!assigned){

        alert("⚠️ Please add a team member first.");

        return;
    }

    let pending = JSON.parse(localStorage.getItem("pendingRequests")) || [];

    let records = JSON.parse(localStorage.getItem("wasteRecords")) || [];

    function saveRequest(imageData = ""){

        const now = new Date();

        const request = {

            date: now.toLocaleDateString(),

            time: now.toLocaleTimeString(),

            location: address,

            note: note,

            type: type,

            image: imageData,

            team: assigned.name,

            contact: assigned.contact,

            vehicle: assigned.vehicle,

            status: "Pending"

        };

        pending.push(request);

        records.push(request);

        localStorage.setItem("pendingRequests", JSON.stringify(pending));

        localStorage.setItem("wasteRecords", JSON.stringify(records));

        alert("✅ Request submitted successfully!");

        document.getElementById("addressInput").value = "";

        document.getElementById("noteInput").value = "";

        document.getElementById("imageInput").value = "";

        showTeamStatus();

    }

    if(imageFile){

        const reader = new FileReader();

        reader.onload = function(e){

            saveRequest(e.target.result);

        };

        reader.readAsDataURL(imageFile);

    }else{

        saveRequest();

    }

}

// ---------------- INITIALIZE ----------------

showTeamStatus();

// Demo team if empty
let teamHistory = JSON.parse(localStorage.getItem("teamHistory"));

if(!teamHistory || teamHistory.length === 0){

    teamHistory = [

        {

            name:"Rahul Patil",

            contact:"9876543210",

            vehicle:"MH12AB1234",

            source:"Hospital",

            available:true

        },

        {

            name:"Sneha More",

            contact:"9876500000",

            vehicle:"MH14CD5678",

            source:"Household",

            available:true

        },

        {

            name:"Amit Jadhav",

            contact:"9876511111",

            vehicle:"MH15EF9999",

            source:"Commercial Place",

            available:true

        }

    ];

    localStorage.setItem("teamHistory", JSON.stringify(teamHistory));

    showTeamStatus();

}

</script>

</body>
</html>

</script>

</body>
</html>

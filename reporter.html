<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Waste Reporter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:linear-gradient(135deg,#d4f8e8,#a8e6cf,#56c596);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  padding-bottom:50px;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

header{
  width:100%;
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
  letter-spacing:2px;
  color:#14532d;
  text-shadow:0 2px 10px rgba(0,0,0,0.2);
}

.container{
  width:90%;
  max-width:500px;
  margin-top:30px;
  padding:30px;
  border-radius:25px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.4);

  box-shadow:
    0 20px 45px rgba(6, 95, 70, 0.4),
    0 0 30px rgba(16, 185, 129, 0.3);

  transition:0.4s;
  animation:fadeIn 1s ease-in-out;
}

.container:hover{
  transform:translateY(-6px);
  box-shadow:
    0 25px 50px rgba(6, 95, 70, 0.5),
    0 0 40px rgba(16, 185, 129, 0.4);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

label{
  display:block;
  margin-top:15px;
  font-size:14px;
  color:#065f46;
  font-weight:600;
}

textarea, input, select{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  border:1px solid #34d399;
  background:#f0fdf4;
  outline:none;
  transition:0.3s;
}

textarea:focus, input:focus, select:focus{
  box-shadow:0 0 12px #34d399;
  border-color:#059669;
}

.submit-btn{
  margin-top:20px;
  background:linear-gradient(45deg,#059669,#10b981);
  color:white;
  padding:12px;
  border:none;
  width:100%;
  font-size:16px;
  border-radius:25px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.submit-btn:hover{
  transform:scale(1.05);
  box-shadow:0 8px 20px rgba(6,95,70,0.4);
}

.status-box{
  background:#ecfdf5;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
  font-size:14px;
  border-left:5px solid #10b981;
}

.free{
  color:#059669;
  font-weight:bold;
}

.busy{
  color:#dc2626;
  font-weight:bold;
}

</style>
</head>

<body>

<header>♻️ Smart Waste Management System</header>

<div class="container">

<div id="teamStatus" class="status-box">
Loading team status...
</div>

<label>📍 Enter Address</label>
<input type="text" id="addressInput" placeholder="Enter your address">

<label>🏢 Select Source</label>
<select id="wasteType" onchange="showTeamStatus()">
<option value="Hospital">Hospital</option>
<option value="Household">Household</option>
<option value="Commercial Place">Commercial Place</option>
</select>

<label>📝 Add Note</label>
<textarea rows="3" id="noteInput"></textarea>

<!-- ✅ ADDED IMAGE FIELD -->
<label>📸 Upload Image</label>
<input type="file" id="imageInput" accept="image/*">

<button class="submit-btn" onclick="submitRequest()">Submit Request</button>

</div>

<script>

let pendingRequests = JSON.parse(localStorage.getItem("pendingRequests")) || [];
let records = JSON.parse(localStorage.getItem("wasteRecords")) || [];

showTeamStatus();

function showTeamStatus() {
  let teamHistory = JSON.parse(localStorage.getItem("teamHistory")) || [];
  const type = document.getElementById("wasteType").value;
  const container = document.getElementById("teamStatus");

  const members = teamHistory.filter(m => m.source === type);

  if (members.length === 0) {
    container.innerHTML = "No team members available for this category.";
    return;
  }

  container.innerHTML = "<b>🚛 Team Status:</b><br><br>";

  members.forEach(member => {
    container.innerHTML += `
      👷 ${member.name} |
      📞 ${member.contact} |
      🚛 ${member.vehicle} |
      Status:
      <span class="${member.available ? 'free' : 'busy'}">
        ${member.available ? 'Free' : 'Busy'}
      </span>
      <br><br>
    `;
  });
}

function assignCollector(type) {
  let teamHistory = JSON.parse(localStorage.getItem("teamHistory")) || [];
  let members = teamHistory.filter(m => m.source === type);
  let freeMembers = members.filter(m => m.available === true);

  if (freeMembers.length === 0) return null;

  let assigned = freeMembers[0];

  let index = teamHistory.findIndex(m =>
    m.name === assigned.name &&
    m.contact === assigned.contact
  );

  teamHistory[index].available = false;
  localStorage.setItem("teamHistory", JSON.stringify(teamHistory));

  return assigned;
}

function submitRequest() {

  const address = document.getElementById("addressInput").value.trim();
  const note = document.getElementById("noteInput").value;
  const type = document.getElementById("wasteType").value;
  const imageFile = document.getElementById("imageInput").files[0];

  if (!address) {
    alert("Please enter an address!");
    return;
  }

  let assignedMember = assignCollector(type);

  if (!assignedMember) {
    alert("❌ No vehicle available.");
    return;
  }

  const now = new Date();

  function saveRequest(imageData = "") {
    let request = {
      date: now.toLocaleDateString(),
      time: now.toLocaleTimeString(),
      location: address,
      note,
      type,
      image: imageData,
      team: `${assignedMember.name} (${assignedMember.contact})`,
      vehicle: assignedMember.vehicle,
      status: "Pending"
    };

    pendingRequests.push(request);
    records.push(request);

    localStorage.setItem("pendingRequests", JSON.stringify(pendingRequests));
    localStorage.setItem("wasteRecords", JSON.stringify(records));

    alert("Request submitted successfully!");

    document.getElementById("noteInput").value = "";
    document.getElementById("addressInput").value = "";
    document.getElementById("imageInput").value = "";

    showTeamStatus();
  }

  if (imageFile) {
    const reader = new FileReader();
    reader.onload = function (e) {
      saveRequest(e.target.result);
    };
    reader.readAsDataURL(imageFile);
  } else {
    saveRequest();
  }
}

</script>

</body>
</html>
